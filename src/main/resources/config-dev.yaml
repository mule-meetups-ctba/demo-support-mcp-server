config:
  environment: "dev"
  http:
    port: "8081"
  orders:
    # Order Support API exposta pelo Public Ingress Omni Gateway
    # Direct endpoint: <app-demo-order-support-api-host>.cloudhub.io
    host: "<ingress-gw-host>"
    basePath: "/techwave-order-support-api/api"
    clientId: "<client_id-do-contrato>"
    # clientSecret é secure property: passada via -Dorders.clientSecret no deploy (nunca em YAML)
  stripe:
    host: "api.stripe.com"
    basePath: "/v1"
  salesforce:
    username: "<salesforce-username>"
  slack:
    host: "slack.com"
    channel: "#support"
